[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animevault"
version = "0.0.1"
description = "A desktop anime library manager — v0.01 minimal manual-entry edition."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AnimeVault Contributors" }
]
dependencies = [
    "pyside6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
animevault = "animevault.cli:main"

# Windowed entry point used by the frozen Windows build.
[project.gui-scripts]
animevault-gui = "animevault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

